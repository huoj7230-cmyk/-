      { route: "R023", seq: 4, lon: 98.4947, lat: 39.7441, type: "部族内迁", label: "肃州南山" },
      { route: "R024", seq: 1, lon: 90.5000, lat: 38.2000, type: "部族内迁", label: "安定卫" },
      { route: "R024", seq: 2, lon: 97.3756, lat: 37.3756, type: "部族内迁", label: "德令哈" },
      { route: "R024", seq: 3, lon: 98.1234, lat: 39.1234, type: "部族内迁", label: "祁连山隘口" },
      { route: "R024", seq: 4, lon: 98.4947, lat: 39.7441, type: "部族内迁", label: "肃州" },
      { route: "R025", seq: 1, lon: 121.8569, lat: 41.5931, type: "部族内附", label: "广宁卫" },
      { route: "R025", seq: 2, lon: 119.7569, lat: 39.9876, type: "部族内附", label: "山海关" },
      { route: "R025", seq: 3, lon: 118.8683, lat: 39.8871, type: "部族内附", label: "永平府" },
      { route: "R025", seq: 4, lon: 116.4074, lat: 39.9042, type: "部族内附", label: "北京城" }
    ];

    // ================================================================
    // 3. 数据处理
    // ================================================================
    const routeMap = {};
    points.forEach(p => {
      if (!routeMap[p.route]) routeMap[p.route] = [];
      routeMap[p.route].push(p);
    });

    const typeColorMap = {
      "自发流民": "#e67e22",
      "灾荒流民": "#c0392b",
      "逃荒逃役": "#8a2a1f",
      "逃役流民": "#b94a3a",
      "自发垦殖": "#2ecc71",
      "经商垦殖": "#d35400",
      "逃荒流民": "#d4524e",
      "垦殖流民": "#27ae60",
      "避役流民": "#8e44ad",
      "渡海垦殖": "#1abc9c",
      "官方民籍": "#2980b9",
      "官方匠户": "#1abc9c",
      "官方富户": "#f1c40f",
      "军籍移民": "#2c3e50",
      "官方谪戍": "#9b59b6",
      "部族内迁": "#7f8c8d",
      "部族内附": "#34495e"
    };
    const defaultColor = "#95a5a6";

    const linesData = [];
    const startPoints = [];
    const endPoints = [];

    Object.keys(routeMap).forEach(rid => {
      const pts = routeMap[rid].sort((a, b) => a.seq - b.seq);
      if (pts.length < 2) return;
      const coords = pts.map(p => [p.lon, p.lat]);
      const type = pts[0].type;
      const color = typeColorMap[type] || defaultColor;
      linesData.push({
        coords: coords,
        type: type,
        color: color,
        routeId: rid
      });
      const first = pts[0];
      const last = pts[pts.length - 1];
      startPoints.push({ name: first.label, value: [first.lon, first.lat], type: first.type, route: rid });
      if (last.label !== '顺天府') {
        endPoints.push({ name: last.label, value: [last.lon, last.lat], type: last.type, route: rid });
      }
    });

    // ================================================================
    // 4. 渲染（多源自动切换）
    // ================================================================
    const chartDom = document.getElementById('map');
    const myChart = echarts.init(chartDom);

    const mapSources = [
      'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
      'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/china.geojson',
      'https://geojson.cn/api/data/china.json'
    ];

    function tryLoadMap(index) {
      if (index >= mapSources.length) {
        document.getElementById('map').innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a7a66;font-size:16px;flex-direction:column;gap:10px;">' +
          '⚠️ 地图数据加载失败<br/><span style="font-size:13px;color:#a58d78;">请检查网络连接，或尝试刷新页面</span>' +
          '</div>';
        return;
      }

      const url = mapSources[index];
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      fetch(url, { signal: controller.signal })
        .then(res => {
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          echarts.registerMap('china', data);
          renderChart();
        })
        .catch(err => {
          clearTimeout(timeoutId);
          setTimeout(() => tryLoadMap(index + 1), 500);
        });
    }

    tryLoadMap(0);

    function renderChart() {
      const option = {
        tooltip: {
          trigger: 'item',
          formatter: function(params) {
            if (params.seriesType === 'lines') {
              const d = params.data;
              const meta = routeMeta[d.routeId] || { start: "?", end: "?" };
              return `<b>${d.routeId}</b><br/>
                      类型：${d.type}<br/>
                      年代：${meta.start} – ${meta.end}`;
            } else if (params.seriesType === 'scatter') {
              return `<b>${params.data.name}</b><br/>类型：${params.data.type}<br/>路线：${params.data.route}`;
            }
            return '';
          }
        },
        geo: {
          map: 'china',
          roam: true,
          zoom: 1.2,
          center: [108, 35],
          label: { show: false },
          itemStyle: {
            areaColor: '#e5d9c6',
            borderColor: '#b3a084',
            borderWidth: 0.8
          },
          emphasis: {
            itemStyle: { areaColor: '#d0bfa6' }
          }
        },
        series: [{
          name: '流民迁徙路线',
          type: 'lines',
          coordinateSystem: 'geo',
          data: linesData.map(item => ({
            coords: item.coords,
            type: item.type,
            routeId: item.routeId,
            lineStyle: {
              color: item.color,
              width: 2.2,
              opacity: 0.8,
              curveness: 0.05
            }
          })),
          polyline: true,
          lineStyle: { color: '#b33a2e', width: 1.8 },
          effect: {
            show: true,
            period: 6,
            trailLength: 0.5,
            symbol: 'arrow',
            symbolSize: 8,
            color: '#d35400'
          },
          zlevel: 2
        }, {
          name: '起点',
          type: 'scatter',
          coordinateSystem: 'geo',
          data: startPoints.map(p => ({
            name: p.name,
            value: p.value,
            type: p.type,
            route: p.route
          })),
          symbol: 'circle',
          symbolSize: 10,
          itemStyle: {
            color: '#2c6b8f',
            borderColor: '#fcf8f2',
            borderWidth: 1.5,
            shadowBlur: 6,
            shadowColor: 'rgba(0,0,0,0.2)'
          },
          label: {
            show: true,
            formatter: '{b}',
            position: 'left',
            distance: 15,
            fontSize: 9,
            color: '#3c2e22',
            fontWeight: 'bold',
            textShadow: '1px 1px 2px rgba(255,255,255,0.9)'
          },
          zlevel: 3
        }, {
          name: '终点',
          type: 'scatter',
          coordinateSystem: 'geo',
          data: endPoints.map(p => ({
            name: p.name,
            value: p.value,
            type: p.type,
            route: p.route
          })),
          symbol: 'diamond',
          symbolSize: 12,
          itemStyle: {
            color: '#b33a2e',
            borderColor: '#fcf8f2',
            borderWidth: 1.5,
            shadowBlur: 6,
            shadowColor: 'rgba(0,0,0,0.2)'
          },
          label: {
            show: true,
            formatter: '{b}',
            position: 'right',
            distance: 15,
            fontSize: 9,
            color: '#3c2e22',
            fontWeight: 'bold',
            textShadow: '1px 1px 2px rgba(255,255,255,0.9)'
          },
          zlevel: 3
        }]
      };

      myChart.setOption(option);
      window.addEventListener('resize', () => myChart.resize());

      // 图例
      const legendInner = document.getElementById('legendInner');
      const typeSet = new Set();
      linesData.forEach(d => typeSet.add(d.type));
      const sortedTypes = Array.from(typeSet).sort();
      legendInner.innerHTML = '<div class="legend-title">迁徙类型</div>';
      sortedTypes.forEach(t => {
        const color = typeColorMap[t] || defaultColor;
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="color-box" style="background:${color};"></span>${t}`;
        legendInner.appendChild(item);
      });
    }
  </script>
</body>
</html>
